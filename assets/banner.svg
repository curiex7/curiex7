<svg fill="none" viewBox="0 0 900 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0b0f19 0%, #0f172a 50%, #1e1b4b 100%);
          border-radius: 16px;
          padding: 30px 40px;
          box-sizing: border-box;
          height: 230px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          position: relative;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .glow-1 {
          position: absolute;
          top: -40px;
          right: -40px;
          width: 260px;
          height: 260px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
          border-radius: 50%;
          pointer-events: none;
        }

        .glow-2 {
          position: absolute;
          bottom: -50px;
          left: 20%;
          width: 220px;
          height: 220px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
          border-radius: 50%;
          pointer-events: none;
        }

        .title {
          font-size: 32px;
          font-weight: 800;
          letter-spacing: 1.5px;
          background: linear-gradient(90deg, #ffffff 0%, #93c5fd 50%, #a5b4fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0 0 6px 0;
          text-transform: uppercase;
        }

        .tagline {
          font-size: 15px;
          font-weight: 600;
          color: #38bdf8;
          letter-spacing: 0.5px;
          margin-bottom: 8px;
        }

        .roles {
          font-size: 15px;
          font-weight: 500;
          color: #cbd5e1;
          margin-bottom: 12px;
        }

        .quote {
          font-size: 13px;
          font-style: italic;
          color: #94a3b8;
          border-left: 3px solid #6366f1;
          padding-left: 12px;
          margin: 0;
        }

        .badge-row {
          position: absolute;
          right: 35px;
          top: 30px;
          display: flex;
          gap: 8px;
        }

        .badge {
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(8px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          color: #e2e8f0;
          font-size: 12px;
          font-weight: 600;
          padding: 6px 12px;
          border-radius: 20px;
        }
      </style>
      <div class="container">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        
        <div class="badge-row">
          <span class="badge">🎓 VIT Chennai</span>
          <span class="badge">📍 India</span>
        </div>

        <h1 class="title">Shubham Bhuyan</h1>
        <div class="tagline">⚡ Code. Create. Innovate.</div>
        <div class="roles">Software Engineer &bull; Full Stack Developer &bull; Machine Learning Enthusiast</div>
        <p class="quote">"Building scalable software, intelligent systems, and impactful digital experiences."</p>
      </div>
    </div>
  </foreignObject>
</svg>
